[project]
name = "my-local-artist-backend"
version = "0.1.0"
requires-python = ">=3.11,<3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Starlette now prefers httpx2 for its TestClient; httpx still works fine.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
